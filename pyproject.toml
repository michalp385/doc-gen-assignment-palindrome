[project]
name = "doc-gen-assignment"
version = "0.1.0"
description = "Document-generation take-home: turn client source material into a finished advice report via a config-driven pipeline."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# You are free to add whatever you like (e.g. pydantic-ai, pytest). These are only what the
# starting scaffold needs to run.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pipeline", "src/document_formatter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the OpenAI API and costs money; run explicitly with -m live"]
addopts = "-m 'not live'"          # default runs are offline; `pytest -m live` overrides this

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"